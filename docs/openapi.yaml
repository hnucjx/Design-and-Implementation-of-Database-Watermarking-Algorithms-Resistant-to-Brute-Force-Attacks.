openapi: 3.1.0
info:
  title: YouTube Downloader API
  version: 0.1.0
  summary: Local single-user download console backed by yt-dlp and SQLite.
  description: |
    HTTP contract of the local FastAPI backend. It is generated by hand from
    `backend/app/main.py` (routes) and `backend/app/schemas.py` (models); those
    two files remain the source of truth.

    Operational notes that are not expressible in the schema:

    * The service listens on `127.0.0.1` and is meant for a single local user.
      There is no authentication, no multi-user isolation and no rate limiting.
      Do not widen the bind address.
    * The port is **configurable, not fixed**: it comes from the `YTDL_API_PORT`
      environment variable (repo-root `.env`) and defaults to `8000`, and
      `python -m app --port` overrides it for a single run. `python -m app` prints
      the address it actually bound at startup. The `servers` entry below is
      therefore the *default* origin only — adjust it if you changed the port.
    * When `frontend/dist` exists, the same process also serves the built UI at
      `/` and `/assets/*`. Otherwise those routes are not registered at all. In
      Vite dev mode the browser talks to `http://127.0.0.1:5173` instead, and Vite
      proxies `/api` to this origin.
    * `GET /api/events` is a plain SSE stream used only as a refresh signal: the
      frontend re-reads `GET /api/jobs` after each message.
    * Only download content you own or are allowed to download. This project
      does not bypass DRM, membership, regional, age or private-video limits.
  contact:
    name: cascade repository
    url: https://github.com/0xaiio/cascade
  license:
    name: See repository
servers:
  - url: http://127.0.0.1:8000
    description: >-
      Default port. Change it with YTDL_API_PORT (repo-root .env), or per run with
      `python -m app --port <port>`; the startup log line "服务地址：..." always
      shows the address in use.
tags:
  - name: health
    description: Liveness and dependency diagnostics.
  - name: analyze
    description: Metadata extraction for a video or playlist URL.
  - name: jobs
    description: Download task creation, inspection and lifecycle control.
  - name: local-files
    description: Controlled local playback and folder opening for finished tasks.
  - name: settings
    description: Runtime settings persisted in the Setting table.
  - name: cookies
    description: Netscape cookie file upload, browser import and removal.
  - name: events
    description: Server-Sent Events stream used as a refresh signal.
  - name: diagnostics
    description: |
      Self-check endpoints. Unlike `/api/diagnostics` they actively touch the
      network or the filesystem: they prove that the resolved proxy really
      works and that the local cookie jar really logs in. All of them are
      read-only - none of them writes settings or cookies.

paths:
  /health:
    get:
      tags: [health]
      operationId: health
      summary: Liveness probe
      description: 'Always returns `{"ok": true}` once the app is up. It does not check yt-dlp, ffmpeg or the database.'
      responses:
        "200":
          description: The process is serving requests.
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
                    const: true
              example:
                ok: true

  /api/diagnostics:
    get:
      tags: [health]
      operationId: getDiagnostics
      summary: Dependency and stability diagnostics
      description: |
        Merges `YtDlpService.get_dependency_status()` with selected settings.
        Secrets are never echoed: PO token, visitor data and browser path are
        reported as booleans only (`*_configured`).
      responses:
        "200":
          description: Current dependency status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiagnosticsRead"
              example:
                cookies_enabled: true
                dependencies:
                  ffmpeg: true
                  ffprobe: true
                  impersonation_available: true
                  impersonation_targets: [chrome, edge, firefox, safari]
                  aria2c_available: true
                  aria2c_enabled: false
                  aria2c_path: C:\Program Files\aria2\aria2c.exe
                  aria2c_connections: 2
                  po_token_provider_available: true
                  po_token_provider: yt-dlp-getpot-wpc
                  po_token_provider_version: 1.0.0
                  youtube_po_browser_path_configured: false
                  youtube_po_token_configured: false
                  youtube_visitor_data_configured: false
                  js_runtime: true
                  js_runtime_name: node
                  js_runtime_version: v22.22.2
                  yt_dlp_version: 2026.07.04
                  youtube_max_parallel_downloads: 5
                  anti403_http_chunk_size_mb: 16
                  throttled_rate_kbps: 0
                log_file: D:\code-repo\cascade\data\logs\app.log
                sanitized_environment: []

  /api/diagnostics/runtime:
    post:
      tags: [diagnostics]
      operationId: refreshRuntimeDiagnostics
      summary: Re-run the JS runtime probe and return diagnostics
      description: |
        Same response as `GET /api/diagnostics`, but the memoised JS runtime
        probe is dropped first. Use it after installing Node/Deno so the app
        does not have to be restarted. No request body.
      responses:
        "200":
          description: Diagnostics computed with a fresh JS runtime probe.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiagnosticsRead"
              example:
                cookies_enabled: true
                dependencies:
                  ffmpeg: true
                  js_runtime: true
                  js_runtime_name: node
                  js_runtime_version: v22.22.2
                  js_runtime_path: C:\Program Files\nodejs\node.exe
                  js_runtime_error: null
                log_file: D:\code-repo\cascade\data\logs\app.log
                sanitized_environment: []

  /api/proxy/test:
    post:
      tags: [diagnostics]
      operationId: testProxyConnection
      summary: Probe the resolved proxy with one HTTPS request
      description: |
        Requests `https://www.youtube.com/robots.txt` through the resolved proxy
        and reports the raw evidence: status code, elapsed time, bytes read and
        the original exception. It never writes settings and never touches a
        running download.

        A **failure can be the expected result**: `proxy=direct` on a machine
        that needs a proxy is supposed to fail, and that failure is what proves
        the proxy option is actually applied.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProxyTestRequest"
            examples:
              saved:
                summary: Probe the currently effective proxy
                value: {}
              draft:
                summary: Try an address without saving it
                value:
                  proxy: http://127.0.0.1:7890
              forceDirect:
                summary: Probe with proxying disabled
                value:
                  proxy: direct
      responses:
        "200":
          description: Probe finished. `ok=false` is a valid outcome.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProxyTestRead"
              examples:
                success:
                  value:
                    ok: true
                    source: system
                    proxy: http://127.0.0.1:7890
                    probe_url: https://www.youtube.com/robots.txt
                    http_status: 200
                    elapsed_ms: 190
                    bytes_read: 792
                    error: null
                    summary: "连通：https://www.youtube.com/robots.txt 返回 HTTP 200，用时 190 ms（代理来源：system，代理：http://127.0.0.1:7890）"
                    next_steps: []
                failure:
                  value:
                    ok: false
                    source: setting
                    proxy: http://127.0.0.1:7890
                    probe_url: https://www.youtube.com/robots.txt
                    http_status: null
                    elapsed_ms: 2008
                    bytes_read: 0
                    error: "URLError: <urlopen error [WinError 10061] 由于目标计算机积极拒绝，无法连接。>"
                    summary: "通过代理 http://127.0.0.1:7890 访问失败：URLError。"
                    next_steps:
                      - 确认代理软件正在运行、端口一致；改完回到这里重新检测
                      - 若代理软件实际没开，把设置改成 direct 以强制直连，避免所有请求都在等超时
                      - 浏览器能打开 youtube.com 不代表应用能：浏览器可能走系统代理，而这里用的是设置里的地址
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/cookies/verify:
    post:
      tags: [diagnostics]
      operationId: verifyCookies
      summary: Inspect the local cookie jar, optionally by logging in
      description: |
        Offline inspection (format, domains, auth cookie names, expiry) and,
        when `deep=true`, one real request to `https://www.youtube.com/` to read
        `"LOGGED_IN"` out of the returned page. This is the only way to tell
        "the login is valid" apart from "the cookies are stale but still on
        disk". The file itself is never echoed back and never modified.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CookieVerifyRequest"
            examples:
              deep:
                value:
                  deep: true
              offline:
                value:
                  deep: false
      responses:
        "200":
          description: Cookie health report.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CookieHealthRead"
              examples:
                valid:
                  value:
                    present: true
                    path: D:\code-repo\cascade\data\cookies.txt
                    filename: cookies.txt
                    size_bytes: 6534
                    format_ok: true
                    format_note: Netscape 格式（Tab 分隔 7 列）
                    cookie_count: 44
                    domains:
                      youtube.com: 23
                      google.com: 13
                      accounts.google.com: 6
                    youtube_domain_count: 23
                    auth_cookie_names: [SID, HSID, SAPISID, LOGIN_INFO]
                    missing_auth_cookie_names: [SSID]
                    anonymous_only: false
                    expired_count: 0
                    verdict: 登录态有效：YouTube 已识别为已登录
                    next_steps: []
                    logged_in: true
                    logged_in_detail: 'YouTube 返回的页面里出现了 "LOGGED_IN":true'
                    checked_at: 1790000000.0
                wrongDomain:
                  value:
                    present: true
                    path: D:\code-repo\cascade\data\cookies.txt
                    cookie_count: 9
                    domains:
                      google.com: 9
                    youtube_domain_count: 0
                    auth_cookie_names: [SID, HSID]
                    anonymous_only: false
                    verdict: 登录态无效：cookie 没有落在 youtube.com 域上，所以请求被当成匿名
                    next_steps:
                      - 这是「只导出到 .google.com」的典型症状：SID 虽然存在，但 .google.com 的 cookie 不会发给 youtube.com
                      - 用 python scripts/export_cookies_via_cdp.py 重新导出（它会校验域名，拿不到就拒绝写文件）
                    logged_in: false
                    logged_in_detail: 'YouTube 返回的页面里是 "LOGGED_IN":false —— 请求被当成匿名'
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/analyze:
    post:
      tags: [analyze]
      operationId: analyzeUrl
      summary: Extract metadata for a video or playlist URL
      description: |
        Runs yt-dlp metadata extraction with `extract_flat=in_playlist`. When
        cookies are enabled and yt-dlp reports a login or bot-check error, the
        backend imports cookies from the local browser once and retries before
        giving up.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalyzeRequest"
            examples:
              singleVideo:
                summary: Analyze one video with local cookies
                value:
                  url: https://www.youtube.com/watch?v=dQw4w9WgXcQ
                  cookies_enabled: true
              playlist:
                summary: Analyze a playlist
                value:
                  url: https://www.youtube.com/playlist?list=PL0000000000000000000
                  cookies_enabled: true
      responses:
        "200":
          description: Metadata for the URL.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyzeResponse"
              example:
                url: https://www.youtube.com/watch?v=dQw4w9WgXcQ
                title: Example video title
                is_playlist: false
                duration: 213.0
                thumbnail: https://i.ytimg.com/vi/dQw4w9WgXcQ/maxresdefault.jpg
                entries: []
                formats:
                  - format_id: "137"
                    label: "137 1080p mp4"
                    height: 1080
                    ext: mp4
                    fps: 30
                    filesize: 112779969
                subtitles:
                  - language: en
                    name: null
                    formats: [srv3, ttml, vtt]
                automatic_subtitles:
                  - language: en
                    name: null
                    formats: [srv3, ttml, vtt]
                ffmpeg:
                  ffmpeg: true
                  ffprobe: true
        "400":
          description: Extraction failed, or the browser cookie import failed.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Error"
                  - $ref: "#/components/schemas/CookieImportError"
        "409":
          description: The browser holding the cookies was locked during the automatic import.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CookieImportError"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/jobs:
    post:
      tags: [jobs]
      operationId: createJob
      summary: Create a download task and enqueue it
      description: |
        Re-analyzes the URL, resolves the selected entries, inserts one `Job`
        plus one `JobItem` per entry, then enqueues the queued item ids. For a
        playlist the task gets its own subfolder under the download root; a
        single-video URL produces exactly one `JobItem`.

        Concurrency applies per video, so a single-video job is never affected
        by the concurrency setting.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateJobRequest"
            examples:
              singleVideo:
                summary: 1440p video with subtitles
                value:
                  url: https://www.youtube.com/watch?v=dQw4w9WgXcQ
                  options:
                    mode: video_subtitles
                    resolution: "1440p"
                    subtitle_languages: [en]
                    subtitle_source: both
                    subtitle_format: best
                    skip_existing: true
                    retries: 10
              playlistSelection:
                summary: Only entries 1 and 3 of a playlist
                value:
                  url: https://www.youtube.com/playlist?list=PL0000000000000000000
                  options:
                    mode: video_only
                    resolution: "1080p"
                    playlist_items: [1, 3]
                    speed_limit_kbps: 2048
                    retries: 5
      responses:
        "201":
          description: Task created and enqueued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobRead"
              example:
                id: 6f1a3d2c-9f4b-4a1e-8c2d-0b7e5a91c3aa
                url: https://www.youtube.com/watch?v=dQw4w9WgXcQ
                title: Example video title
                status: queued
                progress: 0
                speed: null
                eta: null
                total_items: 1
                completed_items: 0
                failed_items: 0
                current_item_title: null
                error: null
                download_dir: D:\Downloads\cascade
                actual_resolution: null
                actual_format: null
                resolution_fallback: null
                created_at: "2026-10-01T00:10:00+00:00"
                updated_at: "2026-10-01T00:10:00+00:00"
                started_at: null
                finished_at: null
                elapsed_seconds: 0
                items:
                  - id: 0f8b1c44-2a55-4c31-9c0a-7d1e6f3b2a10
                    job_id: 6f1a3d2c-9f4b-4a1e-8c2d-0b7e5a91c3aa
                    source_url: https://www.youtube.com/watch?v=dQw4w9WgXcQ
                    title: Example video title
                    index: 1
                    status: queued
                    progress: 0
                    downloaded_bytes: null
                    total_bytes: null
                    speed: null
                    eta: null
                    output_path: null
                    actual_width: null
                    actual_height: null
                    actual_format: null
                    requested_resolution: null
                    fallback_resolution: null
                    fallback_reason: null
                    resolution_fallback: null
                    error: null
                    created_at: "2026-10-01T00:10:00+00:00"
                    updated_at: "2026-10-01T00:10:00+00:00"
                    started_at: null
                    finished_at: null
                    elapsed_seconds: 0
        "400":
          description: Metadata extraction failed, the cookie import failed, or no
            playlist entry was selected.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Error"
                  - $ref: "#/components/schemas/CookieImportError"
              examples:
                noEntries:
                  value:
                    detail: No downloadable playlist entries were selected.
        "409":
          description: The browser holding the cookies was locked during the automatic import.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CookieImportError"
        "422":
          $ref: "#/components/responses/ValidationError"

    get:
      tags: [jobs]
      operationId: listJobs
      summary: List tasks
      description: Returns every task, newest first, each with its items. This is
        the payload the frontend re-reads after an SSE message.
      responses:
        "200":
          description: All tasks.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JobRead"

  /api/jobs/batch:
    post:
      tags: [jobs]
      operationId: batchJobAction
      summary: Pause, restart or delete several tasks
      description: |
        Applies the same action to every existing id in `job_ids`; unknown ids
        are skipped. `delete_files` is only honoured for `action=delete`.

        For `delete` the response carries `jobs: []` because the rows are gone;
        for the other actions the updated read models are returned.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobBatchActionRequest"
            examples:
              pauseMany:
                value:
                  action: pause
                  job_ids: [6f1a3d2c-9f4b-4a1e-8c2d-0b7e5a91c3aa]
                  delete_files: false
              deleteWithFiles:
                value:
                  action: delete
                  job_ids:
                    - 6f1a3d2c-9f4b-4a1e-8c2d-0b7e5a91c3aa
                    - 1c2d3e4f-5a6b-7c8d-9e0f-1a2b3c4d5e6f
                  delete_files: true
      responses:
        "200":
          description: Action applied to the matched tasks.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobBatchActionResponse"
              examples:
                deleteAccepted:
                  value:
                    affected_job_ids: [6f1a3d2c-9f4b-4a1e-8c2d-0b7e5a91c3aa]
                    jobs: []
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/jobs/{job_id}:
    parameters:
      - $ref: "#/components/parameters/JobId"
    get:
      tags: [jobs]
      operationId: getJob
      summary: Get one task
      responses:
        "200":
          description: The task read model.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobRead"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [jobs]
      operationId: deleteJob
      summary: Delete a task
      description: |
        Removes the task, its items and its `JobEvent` rows. With
        `delete_files=true` it also deletes the recorded output file, the merged
        final file and known sidecars, but only inside the download root or the
        task download folder.
      parameters:
        - name: delete_files
          in: query
          required: false
          description: Also delete downloaded media and sidecar files.
          schema:
            type: boolean
            default: false
      responses:
        "204":
          description: Deleted. No content.
        "404":
          $ref: "#/components/responses/NotFound"

  /api/jobs/{job_id}/cancel:
    post:
      tags: [jobs]
      operationId: cancelJob
      summary: Cancel a task
      description: Marks queued items cancelled and signals a running download to
        stop at the next cancellable point. A task that has not started is set to
        `cancelled` immediately.
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: Updated task.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobRead"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/jobs/{job_id}/pause:
    post:
      tags: [jobs]
      operationId: pauseJob
      summary: Pause a task
      description: Pauses queued and running items and clears the task-level speed
        and ETA. A paused download can be resumed with the restart endpoint.
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: Updated task.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobRead"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/jobs/{job_id}/restart:
    post:
      tags: [jobs]
      operationId: restartJob
      summary: Restart a task, optionally at a different resolution
      description: |
        Resets every item to `queued`, clears progress and errors, and enqueues
        them again. Supplying `resolution` overwrites the job options and clears
        any concrete `format_id`. Without a body the previous resolution is
        reused. `continuedl` keeps any existing `.part` file.
      parameters:
        - $ref: "#/components/parameters/JobId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RestartJobRequest"
            examples:
              sameResolution:
                summary: No body
                value: {}
              lowerResolution:
                summary: Retry at 1080p after a fallback suggestion
                value:
                  resolution: "1080p"
      responses:
        "200":
          description: Updated task.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobRead"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/jobs/{job_id}/items/{item_id}/restart:
    post:
      tags: [jobs]
      operationId: restartJobItem
      summary: Restart one item of a playlist task
      description: Same semantics as the task-level restart, but scoped to one
        `JobItem`. The parent task returns to `queued`.
      parameters:
        - $ref: "#/components/parameters/JobId"
        - $ref: "#/components/parameters/ItemId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RestartJobRequest"
      responses:
        "200":
          description: Updated task.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobRead"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/jobs/{job_id}/items/delete:
    post:
      tags: [jobs]
      operationId: deleteJobItems
      summary: Delete selected items of a playlist task
      description: |
        Deletes the given items and their events. When the last item is removed
        the parent task is deleted too and the response reports
        `job_deleted: true` with `job: null`.
      parameters:
        - $ref: "#/components/parameters/JobId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteJobItemsRequest"
            examples:
              deleteTwoItemsWithoutFiles:
                value:
                  item_ids:
                    - 0f8b1c44-2a55-4c31-9c0a-7d1e6f3b2a10
                    - 5a1b2c3d-4e5f-6071-8293-a4b5c6d7e8f9
                  delete_files: false
      responses:
        "200":
          description: Deletion result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteJobItemsResponse"
              examples:
                jobKept:
                  value:
                    deleted_item_ids: [0f8b1c44-2a55-4c31-9c0a-7d1e6f3b2a10]
                    job_deleted: false
                    job:
                      id: 6f1a3d2c-9f4b-4a1e-8c2d-0b7e5a91c3aa
                      url: https://www.youtube.com/playlist?list=PL0000000000000000000
                      title: Example playlist
                      status: queued
                      progress: 0
                      speed: null
                      eta: null
                      total_items: 1
                      completed_items: 0
                      failed_items: 0
                      current_item_title: null
                      error: null
                      download_dir: D:\Downloads\cascade\Example playlist
                      actual_resolution: null
                      actual_format: null
                      resolution_fallback: null
                      created_at: "2026-10-01T00:10:00+00:00"
                      updated_at: "2026-10-01T00:12:00+00:00"
                      started_at: null
                      finished_at: null
                      elapsed_seconds: 0
                      items: []
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/jobs/{job_id}/play:
    post:
      tags: [local-files]
      operationId: playJobVideo
      summary: Play the downloaded file of a single-video task
      description: |
        Resolves the output file from the database (falling back to a YouTube-id
        match inside the task folder) and opens it with a player that can
        confirm decoding the recorded format. Panels such as VLC, mpv, PotPlayer
        and MPC are preferred; a plain MP4 may fall back to Windows Media Player.
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "204":
          description: A player was launched. No content.
        "400":
          description: The operating system opener failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The job is a playlist, the file is missing, or no capable
            player was found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                playlist:
                  value:
                    detail: 合集任务请打开具体视频。
                notReady:
                  value:
                    detail: 视频文件尚不可用。
                noPlayer:
                  value:
                    detail: 找不到可确认能解码当前视频的播放器。当前视频格式：mkv · vp9 + opus。建议安装 VLC media player 或 mpv 后重试。

  /api/jobs/{job_id}/open-folder:
    post:
      tags: [local-files]
      operationId: openJobFolder
      summary: Open the output folder of a task
      description: Opens the item folder for a single-video task, or
        `Job.download_dir` for a playlist task. On Windows a new Explorer window is
        opened and brought to the front.
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "204":
          description: The file manager was launched. No content.
        "400":
          description: The operating system opener failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The folder is not available yet.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/jobs/{job_id}/items/{item_id}/play:
    post:
      tags: [local-files]
      operationId: playJobItemVideo
      summary: Play the downloaded file of one playlist item
      parameters:
        - $ref: "#/components/parameters/JobId"
        - $ref: "#/components/parameters/ItemId"
      responses:
        "204":
          description: A player was launched. No content.
        "400":
          description: The operating system opener failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The file is missing or no capable player was found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/jobs/{job_id}/items/{item_id}/open-folder:
    post:
      tags: [local-files]
      operationId: openJobItemVideoFolder
      summary: Open the output folder of one playlist item
      parameters:
        - $ref: "#/components/parameters/JobId"
        - $ref: "#/components/parameters/ItemId"
      responses:
        "204":
          description: The file manager was launched. No content.
        "400":
          description: The operating system opener failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The folder is not available yet.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/events:
    get:
      tags: [events]
      operationId: streamEvents
      summary: SSE stream of task events
      description: |
        Each event is a single `data: <json>` line followed by a blank line. The
        JSON payload carries at least `type` and `job_id`; types include
        `job_queued`, `job_started`, `item_started`, `item_prepared`,
        `item_progress`, `item_finished`, `item_requeued`, `item_restarted`,
        `items_deleted`, `job_paused`, `job_restarted`, `job_finished`,
        `job_deleted`, `job_cancel_requested` and
        `runtime_download_options_changed`.

        Events are also persisted in the `JobEvent` table. The frontend treats the
        stream as a refresh signal and re-reads `GET /api/jobs`.
      responses:
        "200":
          description: Event stream.
          content:
            text/event-stream:
              schema:
                type: string
              examples:
                progress:
                  summary: A progress tick
                  value: |
                    data: {"type": "item_progress", "job_id": "6f1a3d2c-9f4b-4a1e-8c2d-0b7e5a91c3aa", "item_id": "0f8b1c44-2a55-4c31-9c0a-7d1e6f3b2a10", "status": "downloading", "progress": 42.7, "speed": 1048576.0, "eta": 18}
                finished:
                  summary: A terminal event
                  value: |
                    data: {"type": "job_finished", "job_id": "6f1a3d2c-9f4b-4a1e-8c2d-0b7e5a91c3aa", "status": "succeeded", "error": null}

  /api/settings:
    get:
      tags: [settings]
      operationId: getSettings
      summary: Read runtime settings
      description: Reads persisted `Setting` rows on top of the environment-derived
        defaults, so the response reflects any value previously saved from the UI.
      responses:
        "200":
          description: Effective settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsRead"
              example:
                download_dir: D:\Downloads\cascade
                default_concurrency: 5
                default_subtitle_languages: [en]
                default_resolution: "1440p"
                default_speed_limit_kbps: null
                default_retries: 10
                aria2c_connections: 2
                cookies_enabled: true
                ffmpeg:
                  ffmpeg: true
                  ffprobe: true
    put:
      tags: [settings]
      operationId: updateSettings
      summary: Update runtime settings
      description: |
        Partial update: only the fields present in the body are written. Sending
        `default_speed_limit_kbps: null` explicitly clears the limit, because the
        handler checks `model_fields_set`.

        Side effects:
        * `default_concurrency` resizes the worker pool immediately.
        * `default_speed_limit_kbps` and `default_retries` rewrite the stored
          options of queued, running and paused jobs. A video that is currently
          downloading is cancelled and requeued so the new values take effect
          through continued download; the `.part` file is kept.
        * `aria2c_connections` only updates settings and the service; it does not
          interrupt a running download.
        * `download_dir` is created if needed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsUpdate"
            examples:
              concurrencyAndLimit:
                value:
                  default_concurrency: 2
                  default_speed_limit_kbps: 2048
                  default_retries: 5
              clearLimit:
                value:
                  default_speed_limit_kbps: null
              aria2cConnections:
                value:
                  aria2c_connections: 4
      responses:
        "200":
          description: Settings after the update.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsRead"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/settings/download-dir/select:
    post:
      tags: [settings]
      operationId: selectDownloadDirectory
      summary: Pick the download directory with a native dialog
      description: |
        Opens a Tk directory dialog on the server side and saves the selection
        when the user confirms; returning without a selection leaves settings
        unchanged. Headless environments raise an error, in which case use
        `PUT /api/settings` with an explicit `download_dir`.
      responses:
        "200":
          description: Settings after the dialog closed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsRead"
        "400":
          description: The folder dialog is unavailable in this environment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                noDialog:
                  value:
                    detail: Folder dialog is unavailable in this environment.

  /api/cookies:
    post:
      tags: [cookies]
      operationId: uploadCookies
      summary: Upload a Netscape cookies file
      description: Writes the uploaded bytes to `data/cookies.txt`. The file is
        never echoed back and the directory is git-ignored.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: Netscape-format cookies.txt content.
      responses:
        "200":
          description: Cookie file stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CookieStatus"
              example:
                enabled: true
                filename: cookies.txt
                source: file
                browser: null
                imported_count: null
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      tags: [cookies]
      operationId: deleteCookies
      summary: Delete the local cookies file
      responses:
        "200":
          description: Cookies removed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CookieStatus"
              example:
                enabled: false
                filename: null
                source: none
                browser: null
                imported_count: null

  /api/cookies/from-browser:
    post:
      tags: [cookies]
      operationId: importCookiesFromBrowser
      summary: Import YouTube cookies from a local browser
      description: |
        Tries the requested browser, or the candidate list in order when
        `browser=auto`. Only youtube.com and google.com cookies are kept. If the
        browser database is locked, the response is `409` with a structured
        detail; passing `close_browser_if_locked=true` lets the backend close the
        browser first (Edge only). A DPAPI decryption failure on Edge triggers a
        short headless CDP fallback.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrowserCookieImportRequest"
            examples:
              auto:
                value:
                  browser: auto
                  close_browser_if_locked: false
              edgeForceClose:
                value:
                  browser: edge
                  close_browser_if_locked: true
      responses:
        "200":
          description: Cookies imported.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CookieStatus"
              example:
                enabled: true
                filename: cookies.txt
                source: browser
                browser: edge
                imported_count: 37
        "400":
          description: Import failed, or no YouTube/Google cookies were found.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Error"
                  - $ref: "#/components/schemas/CookieImportError"
        "409":
          description: The browser cookie database is locked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CookieImportError"
              example:
                detail:
                  code: browser_locked
                  browser: edge
                  message: Edge 正在运行，cookies 数据库被锁定。请关闭 Edge 后重试，或确认由应用关闭 Edge 并重新导入。
                  raw_detail: "failed to open database: Permission denied"
        "422":
          $ref: "#/components/responses/ValidationError"

  /:
    get:
      tags: [health]
      operationId: frontendIndex
      summary: Built frontend entry page (conditional)
      description: |
        Registered only when `frontend/dist/index.html` and
        `frontend/dist/assets/` exist, which is the normal single-port
        deployment. In Vite dev mode this route does not exist and the UI is
        served by the Vite dev server instead (its port is whatever the dev
        command was given, conventionally 5173).
      responses:
        "200":
          description: The built `index.html`.
          content:
            text/html:
              schema:
                type: string

components:
  parameters:
    JobId:
      name: job_id
      in: path
      required: true
      description: Task identifier (UUID4 string).
      schema:
        type: string
        format: uuid
      example: 6f1a3d2c-9f4b-4a1e-8c2d-0b7e5a91c3aa
    ItemId:
      name: item_id
      in: path
      required: true
      description: Item identifier (UUID4 string) that must belong to the job.
      schema:
        type: string
        format: uuid
      example: 0f8b1c44-2a55-4c31-9c0a-7d1e6f3b2a10

  responses:
    NotFound:
      description: The task, item or matching set does not exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            job:
              value:
                detail: Job not found.
            item:
              value:
                detail: Job item not found.
            batch:
              value:
                detail: No matching jobs found.
    ValidationError:
      description: Request body failed validation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/HttpValidationError"
          example:
            detail:
              - type: greater_than_equal
                loc: [body, options, retries]
                msg: Input should be greater than or equal to 0
                input: -1

  schemas:
    AnalyzeRequest:
      type: object
      required: [url]
      properties:
        url:
          type: string
          minLength: 1
          description: Video or playlist URL to analyze.
          example: https://www.youtube.com/watch?v=dQw4w9WgXcQ
        cookies_enabled:
          type: boolean
          default: true
          description: Use the local cookies file when it exists.

    FormatOption:
      type: object
      required: [format_id, label]
      description: One selectable yt-dlp format. Storyboard and image-only
        formats are filtered out.
      properties:
        format_id:
          type: string
          example: "137"
        label:
          type: string
          description: Human readable label built from id, height, fps and extension.
          example: 137 1080p mp4
        height:
          type: [integer, "null"]
          example: 1080
        ext:
          type: [string, "null"]
          example: mp4
        fps:
          type: [number, "null"]
          example: 30
        filesize:
          type: [integer, "null"]
          description: Exact or approximate size in bytes.
          example: 112779969

    SubtitleOption:
      type: object
      required: [language]
      properties:
        language:
          type: string
          example: en
        name:
          type: [string, "null"]
        formats:
          type: array
          items:
            type: string
          default: []
          example: [srv3, ttml, vtt]

    VideoEntry:
      type: object
      required: [index, title, url]
      properties:
        index:
          type: integer
          description: 1-based position in the playlist; this is what
            `playlist_items` refers to.
          example: 1
        id:
          type: [string, "null"]
          example: dQw4w9WgXcQ
        title:
          type: string
          example: Example video title
        url:
          type: string
          example: https://www.youtube.com/watch?v=dQw4w9WgXcQ
        duration:
          type: [number, "null"]
          example: 213.0
        thumbnail:
          type: [string, "null"]
          example: https://i.ytimg.com/vi/dQw4w9WgXcQ/maxresdefault.jpg

    AnalyzeResponse:
      type: object
      required: [url, title, is_playlist]
      properties:
        url:
          type: string
          example: https://www.youtube.com/watch?v=dQw4w9WgXcQ
        title:
          type: string
          example: Example video title
        is_playlist:
          type: boolean
          description: True when entries were found or yt-dlp reported `_type=playlist`.
        duration:
          type: [number, "null"]
        thumbnail:
          type: [string, "null"]
        entries:
          type: array
          items:
            $ref: "#/components/schemas/VideoEntry"
          default: []
        formats:
          type: array
          items:
            $ref: "#/components/schemas/FormatOption"
          default: []
        subtitles:
          type: array
          items:
            $ref: "#/components/schemas/SubtitleOption"
          default: []
        automatic_subtitles:
          type: array
          items:
            $ref: "#/components/schemas/SubtitleOption"
          default: []
        ffmpeg:
          type: object
          additionalProperties:
            type: boolean
          default: {}
          example:
            ffmpeg: true
            ffprobe: true

    DownloadOptions:
      type: object
      description: |
        Download intent. The API intentionally accepts no raw yt-dlp options:
        the backend derives selectors, merge behaviour and profile retries from
        these fields.
      properties:
        mode:
          type: string
          enum: [video_subtitles, video_only, subtitles_only]
          default: video_subtitles
        resolution:
          type: string
          default: "1440p"
          description: Target height such as `1080p`, or `best`.
          example: "1440p"
        format_id:
          type: [string, "null"]
          default: null
          description: Legacy escape hatch. When set, the backend forces that
            concrete format and requires ffmpeg.
        subtitle_languages:
          type: array
          items:
            type: string
          default: []
          description: Empty means `all`.
          example: [en]
        subtitle_source:
          type: string
          enum: [human, auto, both]
          default: both
        subtitle_format:
          type: string
          enum: [best, srt, vtt]
          default: best
          description: '`best` leaves yt-dlp''s default in place.'
        playlist_items:
          type: [array, "null"]
          items:
            type: integer
          default: null
          description: 1-based entry indexes to download; `null` for single videos.
          example: [1, 3]
        write_metadata:
          type: boolean
          default: false
          description: Write description and info.json.
        write_thumbnail:
          type: boolean
          default: false
        skip_existing:
          type: boolean
          default: true
          description: Maps to yt-dlp `overwrites=False`.
        speed_limit_kbps:
          type: [integer, "null"]
          default: null
          minimum: 1
          description: Converted to yt-dlp `ratelimit` as kbps * 1024 bytes/s.
        retries:
          type: integer
          default: 10
          minimum: 0
          maximum: 20
        notify_on_complete:
          type: boolean
          default: false
          description: Accepted for compatibility; the download pipeline does not
            consume it, so no system notification is produced.

    CreateJobRequest:
      type: object
      required: [url]
      properties:
        url:
          type: string
          minLength: 1
          example: https://www.youtube.com/watch?v=dQw4w9WgXcQ
        options:
          $ref: "#/components/schemas/DownloadOptions"

    RestartJobRequest:
      type: object
      properties:
        resolution:
          type: [string, "null"]
          default: null
          description: New target resolution. Also clears any stored `format_id`.
          example: "1080p"

    JobBatchActionRequest:
      type: object
      required: [action, job_ids]
      properties:
        action:
          type: string
          enum: [pause, restart, delete]
        job_ids:
          type: array
          minItems: 1
          items:
            type: string
          example: [6f1a3d2c-9f4b-4a1e-8c2d-0b7e5a91c3aa]
        delete_files:
          type: boolean
          default: false
          description: Only honoured when `action` is `delete`.

    DeleteJobItemsRequest:
      type: object
      required: [item_ids]
      properties:
        item_ids:
          type: array
          minItems: 1
          items:
            type: string
          example: [0f8b1c44-2a55-4c31-9c0a-7d1e6f3b2a10]
        delete_files:
          type: boolean
          default: false

    ResolutionFallback:
      type: object
      required: [requested_resolution, fallback_resolution, message]
      description: Present when the backend downgraded or suggests downgrading.
      properties:
        requested_resolution:
          type: string
          example: "1440p"
        fallback_resolution:
          type: string
          example: "1080p"
        reason:
          type: [string, "null"]
          enum:
            - requested_resolution_missing
            - source_below_720_only
            - requested_resolution_unselectable
            - media_stream_blocked
            - null
        restart_resolution:
          type: [string, "null"]
          description: Resolution to send to a restart call, when a retry makes
            sense. `null` means no action is offered.
          example: "1080p"
        message:
          type: string
          example: 视频本来没有 1440p，已自动降级到 1080p。

    JobItemRead:
      type: object
      required:
        - id
        - job_id
        - source_url
        - title
        - index
        - status
        - progress
        - created_at
        - updated_at
      properties:
        id:
          type: string
          example: 0f8b1c44-2a55-4c31-9c0a-7d1e6f3b2a10
        job_id:
          type: string
          example: 6f1a3d2c-9f4b-4a1e-8c2d-0b7e5a91c3aa
        source_url:
          type: string
          example: https://www.youtube.com/watch?v=dQw4w9WgXcQ
        title:
          type: string
          example: Example video title
        index:
          type: integer
          example: 1
        status:
          $ref: "#/components/schemas/JobStatus"
        progress:
          type: number
          description: 0-100. While running it is capped just below 100 and stays
            monotonic until a new substream raises the denominator.
          example: 42.7
        downloaded_bytes:
          type: [integer, "null"]
          example: 48123904
        total_bytes:
          type: [integer, "null"]
          description: Planned size from pre-flight detection, then corrected by
            progress payloads and kept after completion.
          example: 112779969
        speed:
          type: [number, "null"]
          description: Instantaneous bytes per second while running; average speed
            once terminal.
          example: 1048576.0
        eta:
          type: [integer, "null"]
          example: 18
        output_path:
          type: [string, "null"]
          description: Absolute path of the final media file. Projected from the
            download folder by YouTube id when the column is empty.
          example: D:\Downloads\cascade\Example video title [dQw4w9WgXcQ].mp4
        actual_width:
          type: [integer, "null"]
          example: 1920
        actual_height:
          type: [integer, "null"]
          example: 1080
        actual_format:
          type: [string, "null"]
          example: mp4 · vp9 + opus
        requested_resolution:
          type: [string, "null"]
          example: "1440p"
        fallback_resolution:
          type: [string, "null"]
          example: "1080p"
        fallback_reason:
          type: [string, "null"]
          example: requested_resolution_missing
        resolution_fallback:
          oneOf:
            - $ref: "#/components/schemas/ResolutionFallback"
            - type: "null"
        error:
          type: [string, "null"]
          description: Readable failure reason. Media-stream failures are prefixed
            with the current cookie state.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        started_at:
          type: [string, "null"]
          format: date-time
        finished_at:
          type: [string, "null"]
          format: date-time
        elapsed_seconds:
          type: integer
          default: 0

    JobRead:
      type: object
      required:
        - id
        - url
        - title
        - status
        - progress
        - total_items
        - completed_items
        - failed_items
        - created_at
        - updated_at
      properties:
        id:
          type: string
          example: 6f1a3d2c-9f4b-4a1e-8c2d-0b7e5a91c3aa
        url:
          type: string
          example: https://www.youtube.com/watch?v=dQw4w9WgXcQ
        title:
          type: string
          example: Example video title
        status:
          $ref: "#/components/schemas/JobStatus"
        progress:
          type: number
          description: Arithmetic mean of item progress.
          example: 42.7
        speed:
          type: [number, "null"]
        eta:
          type: [integer, "null"]
        total_items:
          type: integer
          example: 1
        completed_items:
          type: integer
          example: 0
        failed_items:
          type: integer
          example: 0
        current_item_title:
          type: [string, "null"]
        error:
          type: [string, "null"]
          description: For a single-item job this is the item error verbatim.
        download_dir:
          type: [string, "null"]
          example: D:\Downloads\cascade
        actual_resolution:
          type: [string, "null"]
          description: Aggregated from items; mixed values become 混合分辨率.
          example: 1920x1080
        actual_format:
          type: [string, "null"]
          description: Aggregated from items; mixed values become 混合格式.
          example: mp4 · vp9 + opus
        resolution_fallback:
          oneOf:
            - $ref: "#/components/schemas/ResolutionFallback"
            - type: "null"
          description: Only populated for single-item jobs.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        started_at:
          type: [string, "null"]
          format: date-time
        finished_at:
          type: [string, "null"]
          format: date-time
        elapsed_seconds:
          type: integer
          default: 0
        items:
          type: array
          items:
            $ref: "#/components/schemas/JobItemRead"
          default: []

    JobBatchActionResponse:
      type: object
      required: [affected_job_ids]
      properties:
        affected_job_ids:
          type: array
          items:
            type: string
        jobs:
          type: array
          description: Empty for `action=delete` because the rows no longer exist.
          items:
            $ref: "#/components/schemas/JobRead"
          default: []

    DeleteJobItemsResponse:
      type: object
      required: [deleted_item_ids, job_deleted]
      properties:
        deleted_item_ids:
          type: array
          items:
            type: string
        job_deleted:
          type: boolean
          description: True when the last item was removed and the task went with it.
        job:
          oneOf:
            - $ref: "#/components/schemas/JobRead"
            - type: "null"

    SettingsRead:
      type: object
      required:
        - download_dir
        - default_concurrency
        - default_subtitle_languages
        - default_resolution
        - default_speed_limit_kbps
        - default_retries
        - aria2c_connections
        - cookies_enabled
        - ffmpeg
      properties:
        download_dir:
          type: string
          example: D:\Downloads\cascade
        default_concurrency:
          type: integer
          minimum: 1
          description: Number of videos downloaded at once, across jobs and items.
          example: 5
        default_subtitle_languages:
          type: array
          items:
            type: string
          example: [en]
        default_resolution:
          type: string
          example: "1440p"
        default_speed_limit_kbps:
          type: [integer, "null"]
        default_retries:
          type: integer
          minimum: 0
          maximum: 20
          example: 10
        aria2c_connections:
          type: integer
          minimum: 1
          maximum: 4
          description: Only used when aria2c is enabled and available.
          example: 2
        cookies_enabled:
          type: boolean
        ffmpeg:
          type: object
          additionalProperties:
            type: boolean
          example:
            ffmpeg: true
            ffprobe: true

    SettingsUpdate:
      type: object
      description: Partial update; omitted fields keep their stored value.
      properties:
        download_dir:
          type: [string, "null"]
        default_concurrency:
          type: [integer, "null"]
          minimum: 1
        default_subtitle_languages:
          type: [array, "null"]
          items:
            type: string
        default_resolution:
          type: [string, "null"]
        default_speed_limit_kbps:
          type: [integer, "null"]
          minimum: 1
        default_retries:
          type: [integer, "null"]
          minimum: 0
          maximum: 20
        aria2c_connections:
          type: [integer, "null"]
          minimum: 1
          maximum: 4

    CookieStatus:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean
        filename:
          type: [string, "null"]
          example: cookies.txt
        source:
          type: string
          enum: [none, file, browser]
          default: none
        browser:
          type: [string, "null"]
          example: edge
        imported_count:
          type: [integer, "null"]
          example: 37

    BrowserCookieImportRequest:
      type: object
      properties:
        browser:
          type: string
          default: auto
          description: One of auto, edge, chrome, firefox, brave, chromium,
            vivaldi, opera.
          example: auto
        close_browser_if_locked:
          type: boolean
          default: false
          description: Let the backend close the browser to release a locked
            cookie database (Edge only).

    ProxyTestRequest:
      type: object
      description: |
        `proxy` follows the exact semantics of `SettingsUpdate.proxy` but is
        never persisted. Omit it (or send `null`) to probe whatever is
        currently effective.
      properties:
        proxy:
          type: [string, "null"]
          description: |
            Absent/null - use the resolved proxy (setting > system > environment).
            A URL - probe that address only.
            `direct` / `none` / `off` / `-` - probe without any proxy.
          example: http://127.0.0.1:7890

    ProxyTestRead:
      type: object
      required: [ok, source, probe_url]
      description: Raw evidence of a single proxy probe.
      properties:
        ok:
          type: boolean
          description: True only when the status is 200 and the body is non-empty.
        source:
          type: string
          enum: [setting, system, environment, direct, none]
          description: Where the proxy came from (same vocabulary as SettingsRead.proxy_source).
          example: system
        proxy:
          type: [string, "null"]
          description: Proxy actually used, credentials redacted. `null` means direct.
          example: http://127.0.0.1:7890
        probe_url:
          type: string
          example: https://www.youtube.com/robots.txt
        http_status:
          type: [integer, "null"]
          example: 200
        elapsed_ms:
          type: integer
          example: 190
        bytes_read:
          type: integer
          example: 792
        error:
          type: [string, "null"]
          description: Original exception text, kept verbatim for the log.
          example: "URLError: <urlopen error [WinError 10061] 由于目标计算机积极拒绝，无法连接。>"
        summary:
          type: string
          description: One-sentence human conclusion.
        next_steps:
          type: array
          items:
            type: string
          description: Actionable advice. Failure responses always carry at least one.

    CookieVerifyRequest:
      type: object
      properties:
        deep:
          type: boolean
          default: true
          description: |
            true - also send the cookie jar to https://www.youtube.com/ and read
            `"LOGGED_IN"` (needs network).
            false - offline inspection only.

    CookieHealthRead:
      type: object
      required: [present, path]
      description: |
        Three layers: file (format), content (domains and auth cookie names),
        and verdict (what to do). `youtube_domain_count == 0` is the most
        dangerous state - the file may contain `SID` yet every request is
        anonymous, because `.google.com` cookies are never sent to
        `www.youtube.com`.
      properties:
        present:
          type: boolean
        path:
          type: string
          example: D:\code-repo\cascade\data\cookies.txt
        filename:
          type: [string, "null"]
          example: cookies.txt
        size_bytes:
          type: integer
          example: 6534
        format_ok:
          type: boolean
        format_note:
          type: string
          example: Netscape 格式（Tab 分隔 7 列）
        cookie_count:
          type: integer
          example: 44
        domains:
          type: object
          additionalProperties:
            type: integer
          example:
            youtube.com: 23
            google.com: 13
        youtube_domain_count:
          type: integer
          example: 23
        auth_cookie_names:
          type: array
          items:
            type: string
          description: Recognised auth cookie names that are present.
          example: [SID, HSID, SAPISID, LOGIN_INFO]
        missing_auth_cookie_names:
          type: array
          items:
            type: string
          example: [SSID]
        anonymous_only:
          type: boolean
        expired_count:
          type: integer
          example: 0
        verdict:
          type: string
          example: 登录态有效：YouTube 已识别为已登录
        next_steps:
          type: array
          items:
            type: string
        logged_in:
          type: [boolean, "null"]
          description: null when the network check was skipped or inconclusive.
        logged_in_detail:
          type: [string, "null"]
          description: The raw observation behind `logged_in`.
          example: 'YouTube 返回的页面里出现了 "LOGGED_IN":true'
        checked_at:
          type: number
          format: double
          example: 1790000000.0

    DiagnosticsRead:
      type: object
      required: [cookies_enabled, dependencies]
      properties:
        cookies_enabled:
          type: boolean
        dependencies:
          type: object
          additionalProperties:
            oneOf:
              - type: boolean
              - type: integer
              - type: "null"
              - type: string
              - type: array
                items:
                  type: string
          description: |
            Keys returned by `get_dependency_status()` merged with selected
            settings: ffmpeg, ffprobe, impersonation_available,
            impersonation_targets, aria2c_available, aria2c_enabled, aria2c_path,
            aria2c_connections, po_token_provider_available, po_token_provider,
            po_token_provider_version, youtube_po_browser_path_configured,
            youtube_po_token_configured, youtube_visitor_data_configured,
            js_runtime, js_runtime_name, js_runtime_version, js_runtime_error,
            js_runtime_candidates_rejected, proxy, proxy_source,
            proxy_writes_ydl_option, system_proxy, environment_proxy,
            yt_dlp_version, youtube_max_parallel_downloads,
            anti403_http_chunk_size_mb, throttled_rate_kbps.
        log_file:
          type: [string, "null"]
          description: |
            Absolute path of the log file being written. `null` when the
            directory is not writable (console-only logging). The file content
            is never exposed through the API.
          example: D:\code-repo\cascade\data\logs\app.log
        sanitized_environment:
          type: array
          description: |
            Host environment variables removed at startup because they break the
            JS runtime (for example `NODE_OPTIONS=--require=...`, which Node
            refuses to load under yt-dlp's `--experimental-permission`). This is
            an audit trail of an action the app took - nothing is hidden.
          items:
            type: object
            required: [name, value, reason]
            properties:
              name:
                type: string
                example: NODE_OPTIONS
              value:
                type: string
                example: '--require="C:\tools\shim.cjs"'
              reason:
                type: string
          example: []

    JobStatus:
      type: string
      enum: [queued, running, paused, succeeded, failed, cancelled]
      description: |
        Shared by jobs and items.
        * `queued` - waiting for a worker.
        * `running` - a worker owns the item, or the job still has work.
        * `paused` - paused by the user.
        * `succeeded` - the item finished, or every item succeeded.
        * `failed` - unrecoverable error, including a stalled download.
        * `cancelled` - cancelled by the user or deleted.

    Error:
      type: object
      required: [detail]
      properties:
        detail:
          type: string
      example:
        detail: Job not found.

    CookieImportError:
      type: object
      required: [detail]
      description: Structured detail returned when cookie handling fails.
      properties:
        detail:
          type: object
          required: [code, browser, message, raw_detail]
          properties:
            code:
              type: string
              example: browser_locked
            browser:
              type: [string, "null"]
              example: edge
            message:
              type: string
              example: Edge 正在运行，cookies 数据库被锁定。请关闭 Edge 后重试，或确认由应用关闭 Edge 并重新导入。
            raw_detail:
              type: [string, "null"]

    HttpValidationError:
      type: object
      properties:
        detail:
          type: array
          items:
            type: object
            properties:
              loc:
                type: array
                items:
                  oneOf:
                    - type: string
                    - type: integer
              msg:
                type: string
              type:
                type: string
              input: {}
